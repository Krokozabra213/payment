  version: "3.9"

  services:

    payment:
      profiles:
        - prod
      container_name: payment
      build:
        context: .
        dockerfile: dev.Dockerfile
      restart: always
      ports:
        - "44050:44050"
      depends_on:
        postgres:
          condition: service_healthy
      env_file:
        - .env

    postgres:
      profiles:
          - prod
      image: postgres:16-alpine
      container_name: payment_db
      restart: always
      env_file:
        - .env
      ports:
        - "5432:5432"
      volumes:
        - pg_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 5s
        timeout: 3s
        retries: 5

    migrate:
      profiles:
          - prod
      container_name: payment-migrate
      build:
        context: .
        dockerfile: Migrate.Dockerfile
      environment:
        GOOSE_DBSTRING: "postgres://payments_user:payments_pass@postgres:5432/payments?sslmode=disable"
      depends_on:
        postgres:
          condition: service_healthy
      restart: "no"

    currency-sync:
      profiles:
        - prod
      container_name: currency-sync
      build:
        context: .
        dockerfile: sync.Dockerfile
      depends_on:
        postgres:
          condition: service_healthy
      restart: "no"
      env_file:
        - .env

    test-postgres:
      profiles:
      - test
      image: postgres:16-alpine
      container_name: test-payment-db
      environment:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
      ports:
        - "5432:5432"
      volumes:
        - test_pg_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 3s
        retries: 5
      restart: "no"

  volumes:
    test_pg_data:
    pg_data:
